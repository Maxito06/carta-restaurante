@if (cargando()) {
  <p>Cargando...</p>
}

@if (error()) {
  <p>{{ error() }}</p>
}

@if (plato(); as p) {
  <article>
    <img [src]="p.imagen" [alt]="p.nombre" />
    <h1>{{ p.nombre }}</h1>
    <p>{{ p.descripcion }}</p>
    <p>{{ p.precio | currency:'COP':'symbol':'1.0-0' }}</p>
  </article>
} @else if (!cargando() && !error()) {
  <p>Plato no encontrado</p>
}

<a routerLink="/">Volver al menú</a>
