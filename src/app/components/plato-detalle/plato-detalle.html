<div class="plato-detalle">
  <a class="volver" routerLink="/">← Volver al menú</a>

  @if (cargando()) {
    <div class="estado-mensaje">
      <p>Cargando...</p>
    </div>
  }

  @if (error()) {
    <div class="estado-mensaje">
      <p>{{ error() }}</p>
    </div>
  }

  @if (plato(); as p) {
    <article class="plato-contenido">
      <div class="plato-imagen-contenedor">
        <img class="plato-imagen" [src]="p.imagen" [alt]="p.nombre" />
      </div>
      <h1 class="plato-nombre">{{ p.nombre }}</h1>
      <p class="plato-descripcion">{{ p.descripcion }}</p>
      <p class="plato-precio">{{ p.precio | currency:'COP':'symbol':'1.0-0' }}</p>
    </article>
  } @else if (!cargando() && !error()) {
    <div class="estado-mensaje">
      <p>Plato no encontrado</p>
    </div>
  }
</div>
